<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisar alunos – Gestão de Alunos</title>
  <meta name="theme-color" content="#1E3B35">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bitter-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-pagina="pesquisar">
  <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>

  <p id="aviso-js" class="aviso-js">
    A carregar… Se esta mensagem não desaparecer, abre o site pelo endereço do servidor
    (<strong>http://localhost:8000</strong>) em vez de abrir o ficheiro com um duplo clique.
  </p>
  <noscript><p class="aviso-js">Este site precisa de JavaScript. Ativa-o no teu browser.</p></noscript>

  <header class="topo" id="topo" hidden></header>

  <main id="conteudo" class="pagina" tabindex="-1" hidden>
    <h1 class="titulo-pagina">Pesquisar alunos</h1>

    <form id="form-pesquisa" class="pesquisa" role="search" autocomplete="off">
      <div class="busca-caixa">
        <span data-icone="procurar"></span>
        <label class="fora-do-ecra" for="q">Nome, telefone, sala ou ocorrência</label>
        <input id="q" name="q" type="search" placeholder="Escreve um nome, um telefone ou «sala 12»"
               autocomplete="off" spellcheck="false" data-busca-principal>
        <button type="button" id="limpar-q" class="btn-limpar" aria-label="Limpar a pesquisa" hidden>
          <span data-icone="fechar"></span>
        </button>
      </div>

      <div class="filtros">
        <div class="campo">
          <label for="f-classe">Classe</label>
          <select id="f-classe"><option value="">Todas</option></select>
        </div>
        <div class="campo">
          <label for="f-turma">Turma</label>
          <select id="f-turma"><option value="">Todas</option></select>
        </div>
        <div class="campo">
          <label for="f-ordem">Ordenar por</label>
          <select id="f-ordem">
            <option value="auto">Nome (A a Z)</option>
            <option value="nome">Nome</option>
            <option value="classe">Classe e turma</option>
            <option value="sala">Sala</option>
            <option value="id">Registados há pouco</option>
          </select>
        </div>
        <label class="interruptor" for="f-oc">
          <input type="checkbox" id="f-oc">
          <span>Só com ocorrência</span>
        </label>
        <div class="vistas" role="group" aria-label="Maneira de mostrar os alunos">
          <button type="button" id="vista-tabela" aria-pressed="true"><span data-icone="tabela"></span>Tabela</button>
          <button type="button" id="vista-fichas" aria-pressed="false"><span data-icone="fichas"></span>Fichas</button>
        </div>
      </div>
    </form>

    <p id="meta" class="meta" role="status"></p>
    <div id="resultados" aria-busy="true"></div>
    <nav id="paginacao" class="paginacao" aria-label="Páginas de resultados"></nav>
  </main>

  <div id="gate" class="gate" hidden></div>
</body>
</html>
