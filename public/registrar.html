<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registar aluno</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/main.js" defer></script>
</head>
<body data-pagina="registrar" data-protegida>

  <header class="topo">
    <a class="marca" href="index.html">Gestão de alunos</a>
    <nav class="menu" id="menu" aria-label="Principal" hidden>
      <a href="index.html" data-nav="index">Início</a>
      <a href="registrar.html" data-nav="registrar">Registar aluno</a>
      <a href="pesquisar.html" data-nav="pesquisar">Pesquisar alunos</a>
    </nav>
    <div class="sessao" id="sessao" hidden>
      <span id="nomeCoordenador"></span>
      <button type="button" class="btn btn--pequeno btn--sair" id="btnSair">Sair</button>
    </div>
  </header>

  <main class="mesa">
    <div class="folha">
      <h1>Registar aluno</h1>
      <p class="intro">Preenche os dados do aluno. A ocorrência é opcional.</p>

      <form id="formRegistar" class="formulario" novalidate>
        <div class="campo" data-campo="nome">
          <label for="r-nome">Nome completo</label>
          <input id="r-nome" name="nome" type="text" autocomplete="off" maxlength="80">
          <p class="erro" hidden></p>
        </div>

        <div class="campo campo--terco" data-campo="classe">
          <label for="r-classe">Classe</label>
          <select id="r-classe" name="classe" data-classes>
            <option value="">Escolhe a classe</option>
          </select>
          <p class="erro" hidden></p>
        </div>

        <div class="campo campo--terco" data-campo="turma">
          <label for="r-turma">Turma</label>
          <input id="r-turma" name="turma" type="text" list="listaTurmas" autocomplete="off" maxlength="10">
          <p class="erro" hidden></p>
        </div>

        <div class="campo campo--terco" data-campo="sala">
          <label for="r-sala">Sala</label>
          <input id="r-sala" name="sala" type="text" autocomplete="off" maxlength="10">
          <p class="erro" hidden></p>
        </div>

        <div class="campo campo--meio" data-campo="encarregado">
          <label for="r-encarregado">Número do encarregado</label>
          <input id="r-encarregado" name="encarregado" type="tel" inputmode="tel" autocomplete="off" placeholder="923 456 789" aria-describedby="r-encarregado-dica">
          <p class="dica" id="r-encarregado-dica">Telefone com 9 dígitos.</p>
          <p class="erro" hidden></p>
        </div>

        <div class="campo" data-campo="ocorrencia">
          <label for="r-ocorrencia">Ocorrência ou problema na escola</label>
          <textarea id="r-ocorrencia" name="ocorrencia" maxlength="500" aria-describedby="r-ocorrencia-dica"></textarea>
          <p class="dica" id="r-ocorrencia-dica">Opcional. Escreve o que aconteceu e quando. Máximo de 500 caracteres.</p>
          <p class="erro" hidden></p>
        </div>

        <div class="accoes">
          <button type="submit" class="btn">Registar aluno</button>
          <a class="btn btn--secundario" href="pesquisar.html">Ver alunos registados</a>
        </div>
      </form>

      <datalist id="listaTurmas"></datalist>
    </div>
  </main>

  <div class="aviso-zona" role="status" aria-live="polite">
    <p class="aviso" id="aviso" hidden></p>
  </div>

</body>
</html>
