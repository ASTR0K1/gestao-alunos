<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel – Gestão de Alunos</title>
  <meta name="theme-color" content="#1E3B35">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bitter-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-pagina="painel">
  <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>

  <p id="aviso-js" class="aviso-js">
    A carregar… Se esta mensagem não desaparecer, abre o site pelo endereço do servidor
    (<strong>http://localhost:8000</strong>) em vez de abrir o ficheiro index.html com um duplo clique.
  </p>
  <noscript><p class="aviso-js">Este site precisa de JavaScript. Ativa-o no teu browser.</p></noscript>

  <header class="topo" id="topo" hidden></header>

  <main id="conteudo" class="pagina" tabindex="-1" hidden>
    <header class="pagina-cabeca">
      <h1 id="saudacao" class="titulo-pagina">Painel</h1>

      <form id="busca-painel" class="busca-grande" action="pesquisar.html" method="get" role="search">
        <div class="busca-caixa">
          <span data-icone="procurar"></span>
          <label class="fora-do-ecra" for="busca-q">Procurar aluno</label>
          <input id="busca-q" name="q" type="search" placeholder="Escreve um nome, um telefone ou «sala 12»"
                 autocomplete="off" spellcheck="false" aria-describedby="busca-estado" data-busca-principal>
          <button class="btn btn-primario" type="submit">Procurar</button>
        </div>
        <p id="busca-estado" class="fora-do-ecra" role="status"></p>
        <ul id="busca-lista" class="busca-lista" hidden></ul>
      </form>
    </header>

    <div id="painel-conteudo" class="painel-conteudo">
      <div class="esqueleto-lista" aria-hidden="true">
        <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
      </div>
    </div>
  </main>

  <div id="gate" class="gate" hidden></div>
</body>
</html>
